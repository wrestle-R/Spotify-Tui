[package]
name = "spotify-tui-playback"
version = "0.4.0"
edition = "2021"
rust-version = "1.85"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio-tungstenite = "0.28"
futures-util = "0.3"
fs2 = "0.4"
libc = "0.2"
url = "2"

[profile.release]
lto = "thin"
strip = true
